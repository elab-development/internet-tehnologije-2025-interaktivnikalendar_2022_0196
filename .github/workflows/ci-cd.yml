name: CI/CD Pipeline

on:
  push:
    branches: [project-setup-database]
  pull_request:
    branches: [project-setup-database]

jobs:

  # Testiranje — pokreće se na svaki push i PR
  test:
    name: Pokreni testove
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Pokreni testove
        run: npm test -- --ci --passWithNoTests
        env:
          DATABASE_URL: mysql://user:pass@localhost:3306/db
          JWT_SECRET: test-secret-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MAILTRAP_HOST: sandbox.smtp.mailtrap.io
          MAILTRAP_PORT: 2525
          MAILTRAP_USER: test
          MAILTRAP_PASS: test

  # Build Docker image — samo na push na main
  build:
    name: Gradi Docker image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/project-setup-database'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prijavi se na GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gradi i objavi Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #Deploy na Render — samo na push na main
  deploy:
    name: Deploy na Render
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/project-setup-database'

    steps:
      - name: Trigeruj deploy na Render
        run: |
          curl -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}'